<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Construction Outlook, live | Cain Menard</title>
<meta name="description" content="A live read on the US construction economy: put-in-place by segment, a transparent forecast, leading indicators and rates. Public data, pulled live and updated monthly.">
<style>
:root{
 --bg:#0A1522; --bg2:#0C1A2B; --card:#0E2136; --line:rgba(150,180,210,.16);
 --ink:#EAF1F8; --ink2:#9DB2C8; --mut:#6E87A5;
 --copper:#B87333; --amber:#F0A86C; --grow:#43A07C; --drop:#C6564E; --steel:#4E88BE;
 --serif:Georgia,'Times New Roman',serif; --sans:Calibri,'Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:
 radial-gradient(120% 90% at 60% -5%,#15304B 0%,#0C1A2B 42%,#0A1421 72%,#070E18 100%) fixed;
 color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:38px 26px 90px}
a{color:var(--amber)}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--amber)}
h1{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.04;margin:12px 0 8px}
h1 em{font-style:italic;color:var(--amber)}
.sub{color:var(--ink2);font-size:15.5px;line-height:1.6;max-width:74ch;margin:6px 0 2px}
.asof{font-family:var(--mono);font-size:11px;letter-spacing:.4px;color:var(--mut);margin-top:14px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mut);margin-right:6px;vertical-align:middle}
.livedot.on{background:var(--grow);box-shadow:0 0 8px var(--grow)}
.sect{margin-top:56px}
.sh{font-family:var(--mono);font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink2);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:22px}
.lead{font-family:var(--serif);font-size:22px;line-height:1.3;color:#fff;margin:0 0 6px}
.leadp{color:var(--ink2);font-size:15px;line-height:1.65;max-width:76ch}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:12px;letter-spacing:.3px}
/* top line */
.topgrid{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:14px;align-items:stretch}
.tl0{background:linear-gradient(160deg,rgba(184,115,51,.14),rgba(14,33,54,.5));border:1px solid rgba(240,168,108,.3);border-radius:6px;padding:20px 22px}
.tlbig{font-family:var(--serif);font-size:44px;color:#fff;line-height:1}
.tlbig .u{font-size:20px;color:var(--amber)}
.tlk{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.tlsub{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:8px;letter-spacing:.3px}
.tlg{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px}
.tlgv{font-family:var(--serif);font-size:28px;color:#fff;line-height:1}
.tlgl{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-top:8px;line-height:1.4}
.tlgd{font-family:var(--mono);font-size:11px;margin-top:8px}
.up{color:var(--grow)} .down{color:var(--drop)} .flat{color:var(--ink2)} .amb{color:var(--amber)}
/* scorecard */
.scorewrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.scol{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 0 8px}
.scolh{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.scolt{font-family:var(--serif);font-size:19px}
.scolc{font-family:var(--mono);font-size:11px;color:var(--mut)}
.up .scolt,.scol.up .scolt{color:var(--grow)} .scol.stable .scolt{color:var(--amber)} .scol.down .scolt{color:var(--drop)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;transition:background .12s;background:transparent;border:none;border-bottom:1px solid rgba(150,180,210,.06);width:100%;text-align:left;color:inherit;font-family:inherit}
.srow:hover{background:rgba(184,115,51,.1)}
.srdot{width:7px;height:7px;border-radius:2px;flex:none}
.srn{flex:1;font-size:13.5px;color:var(--ink)}
.srv{font-family:var(--serif);font-size:15px;color:#fff}
.srg{font-family:var(--mono);font-size:11px;width:52px;text-align:right}
/* quadrant */
.qwrap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px 12px}
.qplot{position:relative;width:100%;height:460px;margin-top:6px}
.qgrid{position:absolute;inset:0}
.qaxL{position:absolute;left:0;top:0;bottom:26px;width:1px;background:var(--line)}
.qaxB{position:absolute;left:0;right:0;bottom:26px;height:1px;background:var(--line)}
.qref{position:absolute;left:0;right:0;height:1px;background:rgba(240,168,108,.35);border-top:1px dashed rgba(240,168,108,.5)}
.qreflab{position:absolute;right:0;font-family:var(--mono);font-size:9.5px;color:var(--amber);transform:translateY(-12px)}
.qbub{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:box-shadow .15s,outline .12s;display:flex;align-items:center;justify-content:center}
.qbub:hover{outline:2px solid var(--amber);z-index:5}
.qbub.rca{outline:2px solid rgba(240,168,108,.55)}
.qlab{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9px;color:var(--ink2);pointer-events:none;white-space:nowrap;text-shadow:0 1px 3px #060d18}
.qtk{position:absolute;font-family:var(--mono);font-size:9px;color:var(--mut)}
.qleg{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:10px}
.qleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* detail panel */
.detail{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-top:16px;display:none}
.detail.on{display:block}
.dh{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.dt{font-family:var(--serif);font-size:24px;color:#fff}
.dtag{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.dcurve{width:100%;height:150px;margin:16px 0 4px;display:block}
.dtable{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.dcell{border:1px solid var(--line);border-radius:4px;padding:10px 8px;text-align:center}
.dcy{font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.dcv{font-family:var(--serif);font-size:17px;color:#fff;margin-top:3px}
.dcg{font-family:var(--mono);font-size:11px;margin-top:2px}
.ddrv{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:14px;letter-spacing:.3px}
/* indicators */
.indgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ind{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.indt{font-family:var(--serif);font-size:17px;color:#fff}
.indsub{font-family:var(--mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-top:2px}
.indv{font-family:var(--serif);font-size:30px;color:#fff;margin:12px 0 2px;line-height:1}
.indd{font-family:var(--mono);font-size:11px}
.gauge{margin:14px 0 4px}
.gbar{height:9px;border-radius:5px;background:linear-gradient(90deg,#7a2f2c,#5a4a2e 46%,#2f5a45 54%,#2f6a4f);position:relative}
.gmark{position:absolute;top:-5px;width:3px;height:19px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.6)}
.g50{position:absolute;top:-3px;left:50%;width:1px;height:15px;background:rgba(255,255,255,.4)}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:7px}
.spark{display:flex;align-items:flex-end;gap:5px;height:42px;margin:12px 0 4px}
.sbar{flex:1;background:var(--copper);border-radius:2px 2px 0 0;min-height:3px}
.asofm{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:8px;letter-spacing:.3px}
/* method + scenario */
.method{background:linear-gradient(160deg,rgba(78,136,190,.1),rgba(14,33,54,.4));border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.mrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.scbtn{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);background:transparent;border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;transition:.15s}
.scbtn:hover{border-color:rgba(240,168,108,.5);color:#fff}
.scbtn.on{background:var(--copper);border-color:var(--copper);color:#0C1420}
.step{counter-increment:s;font-size:14px;line-height:1.6;color:var(--ink2);margin:8px 0;padding-left:30px;position:relative}
.step:before{content:counter(s);position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid rgba(240,168,108,.4);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.steps{counter-reset:s;margin-top:10px}
.step b{color:#fff}
/* time machine (scrubber) */
.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.bar{display:flex;align-items:center;gap:12px;padding:5px 0}
.barname{width:150px;flex:none;font-size:13px;color:var(--ink)}
.bartrack{flex:1;height:20px;background:rgba(150,180,210,.07);border-radius:3px;position:relative;overflow:hidden}
.barfill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,.7,.3,1)}
.barval{width:64px;flex:none;text-align:right;font-family:var(--serif);font-size:15px;color:#fff}
.tmhead{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.tmdate{font-family:var(--serif);font-size:34px;color:#fff;line-height:1;min-width:120px}
.tmlead{font-family:var(--mono);font-size:11px;letter-spacing:.4px;color:var(--ink2)}
.tmlead b{color:var(--amber)}
.tmbar{display:flex;align-items:center;gap:14px;margin-top:16px}
.tmplay{font-family:var(--mono);font-size:12px;width:40px;height:34px;flex:none;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:3px;cursor:pointer}
.tmplay:hover{border-color:rgba(240,168,108,.5);color:#fff}
.tmplay.on{background:var(--copper);border-color:var(--copper);color:#0C1420}
#tmrange{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--copper) 0%,var(--copper) var(--p,100%),rgba(150,180,210,.16) var(--p,100%));outline:none;cursor:pointer}
#tmrange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #0C1420;box-shadow:0 0 8px rgba(240,168,108,.6);cursor:grab}
#tmrange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #0C1420;cursor:grab}
/* state map */
.mapgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;max-width:760px;margin:2px auto 0}
.st{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.9);position:relative;border:1px solid rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.st:hover{transform:scale(1.12);z-index:3;box-shadow:0 0 0 1px rgba(240,168,108,.7)}
.maplegend{display:flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--mono);font-size:10px;color:var(--mut);justify-content:center}
.legramp{display:inline-flex;gap:2px}
.legramp span{width:22px;height:10px;border-radius:1px}
/* read cards */
.read{margin-top:16px;border-left:2px solid var(--copper);padding:2px 0 2px 14px}
.readh{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.readp{font-size:14px;line-height:1.6;color:var(--ink2)}
.readp b{color:#fff;font-weight:600}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:#071019;border:1px solid rgba(240,168,108,.5);border-radius:4px;padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--ink);max-width:270px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#tip .tt{color:#fff;font-size:12px;margin-bottom:3px}
footer{margin-top:64px;border-top:1px solid var(--line);padding-top:22px;color:var(--mut);font-size:12.5px;line-height:1.7}
footer .src{font-family:var(--mono);font-size:11px}
@media(max-width:900px){.topgrid{grid-template-columns:1fr 1fr}.scorewrap{grid-template-columns:1fr}.indgrid{grid-template-columns:1fr}h1{font-size:32px}.qplot{height:380px}.barname{width:110px}}
</style>
</head>
<body data-palette="#B87333,#F0A86C,#43A07C,#C6564E,#4E88BE">
<div class="wrap" id="wrap"></div>
<div id="tip"><div class="tt"></div><div class="tb"></div></div>
<script>
/* ============================================================
   Construction Outlook, live. Public data (Census put-in-place
   via FRED, plus BLS, Freddie Mac, AIA, Dodge), pulled live and
   updated monthly. The forecast is a transparent, reproducible
   projection, not a survey and not a black box. Method at the
   bottom of the page.
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const C=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const B=x=>'$'+x.toFixed(x>=100?0:1)+'B';
const PCT=x=>(x>0?'+':'')+(x*100).toFixed(x>-0.1&&x<0.1?1:0)+'%';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;

/* ---- segments: live nonresidential + nonbuilding (Census put-in-place via FRED) ----
   lvl = $B annualized (SAAR), yoy = trailing 12 months, tr = 10-year CAGR.
   Seeds are mid-2026 FRED reads; the live refresh overwrites them each visit. */
let SEG=[
 {k:"Manufacturing",fred:"TLMFGCONS",grp:"nrb",lvl:172.7,yoy:-0.214,tr:0.076,rca:1,drv:"ISM PMI, industrial production, capacity utilization, durable-goods orders"},
 {k:"Office",fred:"TLOFCONS",grp:"nrb",lvl:132.8,yoy:0.125,tr:0.069,rca:1,drv:"office vacancy, unemployment. Data centers sit inside this line"},
 {k:"Commercial",fred:"TLCOMCONS",grp:"nrb",lvl:121.2,yoy:-0.059,tr:0.047,rca:1,drv:"retail sales, income, CPI. Warehouse is about half of it"},
 {k:"Educational",fred:"TLEDUCONS",grp:"nrb",lvl:137.7,yoy:-0.006,tr:0.038,rca:1,drv:"school-age population, government spending, bond passage"},
 {k:"Health care",fred:"TLHLTHCONS",grp:"nrb",lvl:74.8,yoy:-0.015,tr:0.064,rca:1,drv:"population 75+, uninsured rate, government spending"},
 {k:"Lodging",fred:"TLLODGCONS",grp:"nrb",lvl:24.5,yoy:-0.091,tr:-0.012,rca:1,drv:"occupancy, RevPAR, room starts"},
 {k:"Amusement & rec",fred:"TLAMUSCONS",grp:"nrb",lvl:49.1,yoy:0.029,tr:0.072,rca:1,drv:"income, savings rate, employment"},
 {k:"Religious",fred:"TLRELCONS",grp:"nrb",lvl:6.5,yoy:0.282,tr:0.051,rca:0,drv:"GDP, population, income"},
 {k:"Public safety",fred:"TLPSCONS",grp:"nrb",lvl:21.2,yoy:-0.072,tr:0.102,rca:0,drv:"population, government spending, incarceration"},
 {k:"Communication",fred:"TLCMUCONS",grp:"nrb",lvl:29.4,yoy:0.023,tr:0.032,rca:0,drv:"AI network demand, private investment, BEAD buildout"},
 {k:"Power",fred:"TLPWRCONS",grp:"nb",lvl:177.6,yoy:0.035,tr:0.056,rca:0,drv:"utility capex, load growth, turbine and transformer lead times"},
 {k:"Highway & street",fred:"TLHWYCONS",grp:"nb",lvl:152.1,yoy:0.029,tr:0.052,rca:0,drv:"IIJA funding, government spending, population"},
 {k:"Transportation",fred:"TLTRANSCONS",grp:"nb",lvl:72.5,yoy:0.022,tr:0.045,rca:0,drv:"airport capex, government spending, transit funding"},
 {k:"Sewage & waste",fred:"TLSWDCONS",grp:"nb",lvl:52.9,yoy:-0.020,tr:0.085,rca:0,drv:"population, government spending, PFAS rules"},
 {k:"Water supply",fred:"TLWSCONS",grp:"nb",lvl:35.7,yoy:0.009,tr:0.093,rca:0,drv:"population, government spending, lead-line funding"},
 {k:"Conservation",fred:"TLCADCONS",grp:"nb",lvl:16.6,yoy:0.318,tr:0.074,rca:0,drv:"US Army Corps appropriations, population"},
];
/* residential: the group total is live (TLRESCONS); the sub-split is the latest Census release */
let RES=[
 {k:"Improvements",grp:"res",lvl:404,yoy:0.05,tr:0.045,rca:0,drv:"home equity, HELOC balances, home prices"},
 {k:"Single-family",grp:"res",lvl:409,yoy:-0.04,tr:0.03,rca:1,drv:"mortgage rates, income, starts, permits, NAHB sentiment"},
 {k:"Multifamily",grp:"res",lvl:127,yoy:-0.01,tr:0.055,rca:0,drv:"vacancy, absorption, lending, starts"},
];
const GLBL={nrb:"Nonres buildings",nb:"Nonbuilding",res:"Residential"};
const GCOL={nrb:"var(--copper)",nb:"var(--steel)",res:"var(--amber)"};
let AGG={total:2166.5,res:889.4,nrb:770.5,nb:507.4,asof:"Jun 2026"};

/* leading indicators (public). Rate/PPI/starts refresh live; ABI, Dodge, PMI are the latest release. */
let IND={
 abi:{v:47.3,asof:"Jul 2026",series:[45.5,47.1,48.3,44.5,46.8,47.3]},
 dodge:{v:0.218,asof:"Jul 2026",series:[3,2,6,9,-2,21.8]},
 pmi:{v:49.0,asof:"Jun 2026"},
 rate:{v:6.66,asof:"Jul 2026",fred:"MORTGAGE30US"},
 ppi:{v:0.076,asof:"Jun 2026",fred:"WPUSI012011"},
 starts:{v:1.24,asof:"Jun 2026",fred:"HOUST"},
};

/* ---- the forecast: recent momentum easing to the segment's 10-year trend. One knob. ---- */
let W=0.60, LIVE=false, SERIES={};
const SCEN={base:0.60,momentum:0.85,trend:0.35};
function forecast(yoy,tr,w){
 const gm=clamp(yoy,-0.20,0.22);
 let y1=clamp(w*gm+(1-w)*tr,-0.22,0.22);
 const anchor=clamp(0.5*tr+0.5*0.045,-0.01,0.09);
 const g=[]; let cur=y1;
 for(let i=0;i<4;i++){g.push(cur);cur=cur+(anchor-cur)*0.5;}
 let lvl=1; g.forEach(x=>lvl*=1+x);
 return {g,cagr:Math.pow(lvl,1/4)-1};
}
const fc=s=>forecast(s.yoy,s.tr,W);
const cls=y=>y>=0.05?"up":(y<0?"down":"stable");
const ALL=()=>SEG.concat(RES);

/* ---- tooltip ---- */
const tip=$('#tip');
function showTip(h,e){tip.querySelector('.tt').innerHTML=h.t;tip.querySelector('.tb').innerHTML=h.b;tip.style.opacity='1';move(e);}
function move(e){tip.style.left=Math.min(e.clientX+14,innerWidth-282)+'px';tip.style.top=(e.clientY+16)+'px';}
function hideTip(){tip.style.opacity='0';}
addEventListener('pointerdown',hideTip);

/* ================= render ================= */
function render(){
 $('#wrap').innerHTML = headerH()+toplineH()+scorecardH()+quadrantH()+detailH()+indicatorsH()+methodH()+scrubberH()+mapH()+footerH();
 layoutQuadrant(); wireRows(); wireScenario(); initScrubber(); initMap();
}
function headerH(){
 return `<header>
  <div class="kick">Construction Outlook &middot; live</div>
  <h1>The construction economy,<br><em>live.</em></h1>
  <p class="sub">The same public data the quarterly outlooks run on, pulled live and updated every month: put-in-place by segment, a transparent forecast, the indicators that run ahead of the work, and rates. The forecast shows its math. Nothing here is a survey or a black box.</p>
  <div class="asof"><span class="livedot" id="livedot"></span><span id="asof">Latest Census put-in-place through ${AGG.asof}. Sources at the bottom.</span></div>
 </header>`;
}
function toplineH(){
 const tiles=[["res","Residential",AGG.res],["nrb","Nonres buildings",AGG.nrb],["nb","Nonbuilding",AGG.nb]]
  .map(g=>`<div class="tlg"><div class="tlgv">$${(g[2]/1000).toFixed(2)}T</div><div class="tlgl">${g[1]}</div></div>`).join('');
 return `<section class="sect"><div class="sh">The top line</div>
  <div class="topgrid">
   <div class="tl0"><div class="tlk">Total put in place &middot; annualized</div><div class="tlbig">$${(AGG.total/1000).toFixed(2)}<span class="u">T</span></div><div class="tlsub">SAAR, latest month. Census, live via FRED.</div></div>
   ${tiles}
  </div>
  <div class="hint">Annualized rate, not a full-year total. Residential is the live group total; the segment view below breaks out the rest.</div>
 </section>`;
}
function scorecardH(){

function wireRows(){ $$('.srow').forEach(b=>b.onclick=()=>openDetail(b.dataset.seg)); }
function openDetail(key){
 const s=ALL().find(x=>x.k===key); if(!s)return;
 const f=fc(s), years=[2027,2028,2029,2030];
 let lvl=s.lvl; const path=[{y:2026,g:s.yoy,l:s.lvl}];
 f.g.forEach((g,i)=>{lvl=lvl*(1+g);path.push({y:years[i],g,l:lvl});});
 const cells=path.map(p=>`<div class="dcell"><div class="dcy">${p.y}${p.y===2026?' now':''}</div><div class="dcv">$${p.l.toFixed(0)}B</div><div class="dcg ${p.g>0?'up':(p.g<0?'down':'flat')}">${PCT(p.g)}</div></div>`).join('');
 const d=$('#detail');
 d.innerHTML=`<div class="dh"><div><div class="dtag">${GLBL[s.grp]} &middot; ${(f.cagr*100>=0?'+':'')}${(f.cagr*100).toFixed(1)}% projected CAGR</div><div class="dt">${s.k}</div></div><button class="scbtn" id="dclose">Close</button></div>`
  +drawCurve(s,path)
  +`<div class="dtable">${cells}</div>`
  +`<div class="ddrv">Drivers: ${s.drv}.</div>`;
 d.classList.add('on');
 $('#dclose').onclick=()=>d.classList.remove('on');
 d.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function drawCurve(s,path){
 const W2=1080,H=150,pad=8; const hist=SERIES[s.fred];
 let pts=[], vals=[];
 if(hist&&hist.length){const h=hist.slice(-120); pts=h.map(p=>p[1]/1000); }
 const fwd=path.map(p=>p.l);
 const all=pts.concat(fwd); const mn=Math.min(...all)*0.9, mx=Math.max(...all)*1.05;
 const X=i=>pad+i/(all.length-1)*(W2-2*pad), Y=v=>H-pad-((v-mn)/(mx-mn))*(H-2*pad);
 let dh='',df='';
 pts.forEach((v,i)=>dh+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
 const off=pts.length;
 fwd.forEach((v,i)=>df+=(i?'L':'M')+X(off-1+i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
 if(pts.length)df='M'+X(off-1).toFixed(1)+' '+Y(pts[pts.length-1]).toFixed(1)+' '+df.replace(/^M[^L]*/,'');
 return `<svg class="dcurve" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none">
   ${pts.length?`<path d="${dh}" fill="none" stroke="var(--ink2)" stroke-width="2"/>`:''}
   <path d="${df}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="2 5"/>
  </svg>`+(pts.length?'':`<div class="hint" style="margin-top:0">Live history loads with the page; the dashed line is the projection.</div>`);
}

/* ---- scrubber (live history) ---- */
function initScrubber(){
 const order=SEG.map(s=>s.k);
 const el=id=>document.getElementById(id);
 let dates=[],data={},MAX=1,idx=0,playing=false,timer=null;
 function build(){
  const withS=SEG.filter(s=>SERIES[s.fred]&&SERIES[s.fred].length);
  if(!withS.length){el('tmhint').textContent='Live monthly history was not reachable. The rest of the page still reflects the latest release.';return false;}
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const base=withS[0].fred; dates=SERIES[base].map(p=>{const d=p[0].split('-');return MON[+d[1]-1]+' '+d[0];});
  data={}; withS.forEach(s=>{const m={};SERIES[s.fred].forEach((p,i)=>m[i]=p[1]/1000);data[s.k]=dates.map((_,i)=>m[i]!=null?m[i]:null);});
  MAX=1; Object.values(data).forEach(a=>a.forEach(v=>{if(v>MAX)MAX=v;}));
  return true;
 }
 function draw(){
  const segs=SEG.filter(s=>data[s.k]);
  const cur=segs.map(s=>({k:s.k,v:data[s.k][idx]}));
  let lead={k:'',v:-1}; cur.forEach(o=>{if(o.v>lead.v)lead=o;});
  el('tmdate').textContent=dates[idx]||''; el('tmlead').innerHTML=lead.v>0?('Leading &middot; <b>'+lead.k+'</b> $'+lead.v.toFixed(0)+'B a year'):'';
  el('tmchart').innerHTML=cur.sort((a,b)=>b.v-a.v).slice(0,10).map(o=>{
   const col=o.k===lead.k?'var(--amber)':'var(--copper)';
   return '<div class="bar"><div class="barname">'+o.k+'</div><div class="bartrack"><div class="barfill" style="width:'+(o.v/MAX*100).toFixed(1)+'%;background:'+col+'"></div></div><div class="barval">$'+(o.v!=null?o.v.toFixed(0):'-')+'B</div></div>';
  }).join('');
  el('tmrange').style.setProperty('--p',(dates.length>1?idx/(dates.length-1)*100:100)+'%');
 }
 function setIdx(i){idx=clamp(i,0,dates.length-1);el('tmrange').value=idx;draw();}
 function stop(){playing=false;clearInterval(timer);const b=el('tmplay');b.classList.remove('on');b.innerHTML='&#9654;';}
 function play(){if(playing){stop();return;}playing=true;const b=el('tmplay');b.classList.add('on');b.innerHTML='&#10073;&#10073;';if(idx>=dates.length-1)setIdx(0);timer=setInterval(()=>{if(idx>=dates.length-1){stop();return;}setIdx(idx+1);},90);}
 if(!build())return;
 el('tmrange').max=dates.length-1; el('tmrange').oninput=function(){stop();setIdx(+this.value);}; el('tmplay').onclick=play;
 el('tmhint').innerHTML='<span class="livedot on"></span>Live monthly data via FRED. Drag the handle or press play.';
 setIdx(dates.length-1);
}

/* ---- live refresh ---- */
async function fetchLive(){
 try{
  const ids=SEG.map(s=>s.fred).concat(['TTLCONS','TLRESCONS','TLNRESCONS']).join(',');
  const r=await fetch('/api/fred?series='+ids+'&start=2007-01-01&freq=m',{cache:'no-store'});
  if(!r.ok)throw 0; const j=await r.json(); if(!j.ok||!j.series)throw 0;
  SERIES=j.series;
  SEG.forEach(s=>{const a=SERIES[s.fred]; if(a&&a.length>13){const x=a.map(p=>p[1]);s.lvl=+(x[x.length-1]/1000).toFixed(1);s.yoy=+(x[x.length-1]/x[x.length-13]-1).toFixed(4);const k=Math.min(121,x.length);s.tr=+(Math.pow(x[x.length-1]/x[x.length-k],12/(k-1))-1).toFixed(4);}});
  const tot=SERIES['TTLCONS'],res=SERIES['TLRESCONS'],nres=SERIES['TLNRESCONS'];
  if(tot&&tot.length)AGG.total=+(tot[tot.length-1][1]/1000).toFixed(1);
  if(res&&res.length)AGG.res=+(res[res.length-1][1]/1000).toFixed(1);
  AGG.nrb=SEG.filter(s=>s.grp==='nrb').reduce((s,x)=>s+x.lvl,0);
  AGG.nb=SEG.filter(s=>s.grp==='nb').reduce((s,x)=>s+x.lvl,0);
  if(tot&&tot.length){const d=tot[tot.length-1][0].split('-');AGG.asof=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+d[1]-1]+' '+d[0];}
  LIVE=true; render();
  const ld=$('#livedot'); if(ld)ld.classList.add('on');
  const as=$('#asof'); if(as)as.textContent='Live via FRED. Latest Census put-in-place through '+AGG.asof+'. Sources at the bottom.';
 }catch(e){/* keep the seeded read */}
 // rates / PPI / starts, best effort
 try{
  const r=await fetch('/api/fred?series=MORTGAGE30US,WPUSI012011,HOUST&start=2024-01-01&freq=m',{cache:'no-store'});
  if(r.ok){const j=await r.json(); if(j.ok){
   const g=(id,f)=>{const a=j.series[id];if(a&&a.length)f(a);};
   g('MORTGAGE30US',a=>IND.rate.v=a[a.length-1][1]);
   g('WPUSI012011',a=>{if(a.length>12)IND.ppi.v=+(a[a.length-1][1]/a[a.length-13][1]-1).toFixed(3);});
   g('HOUST',a=>IND.starts.v=+(a[a.length-1][1]/1000).toFixed(2));
   render();
  }}
 }catch(e){}
}
