<style>
:root{
 --paper:#FAF8F5; --paper2:#F4EFE7; --card:#FFFDFA; --ink:#1E2A38; --ink2:#3C4859; --mut:#8B8578;
 --copper:#B87333; --copper2:#9A571F; --line:#E6DFD3; --line2:#D8CFBF;
 --up:#3F7A57; --down:#B0483B; --steel:#4E6E8E;
 --blue:#2A6FB0; --blue2:#184F95; --teal:#1F9B78;
 --serif:'Newsreader',Georgia,'Times New Roman',serif;
 --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
 background:radial-gradient(120% 70% at 50% -10%, #FFFFFF 0%, var(--paper) 46%, var(--paper2) 100%) fixed;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(184,115,51,.2)}
a{color:var(--copper2);text-decoration:none;border-bottom:1px solid rgba(154,87,31,.35)}
a:hover{border-color:var(--copper2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 30px 100px;position:relative}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--copper2)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mut)}
/* reveal */
.rv{opacity:0;transform:translateY(14px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;padding:26px 0 16px;border-bottom:1px solid var(--line)}
.brandmark{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.2px;color:var(--ink)}
.brandmark .dot{color:var(--copper)}
.mastr{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.pulse{display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.pulse.on i{background:var(--up);box-shadow:0 0 0 0 rgba(63,122,87,.5);animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(63,122,87,.45)}70%{box-shadow:0 0 0 7px rgba(63,122,87,0)}100%{box-shadow:0 0 0 0 rgba(63,122,87,0)}}
/* hero */
.hero{display:grid;grid-template-columns:1.55fr .95fr;gap:48px;align-items:end;padding:60px 0 38px;border-bottom:1px solid var(--line)}
.hlead{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.6vw,58px);line-height:1.04;letter-spacing:-.01em;color:var(--ink);margin:14px 0 0}
.hlead em{font-style:italic;color:var(--copper2)}
.hdeck{font-size:18px;line-height:1.6;color:var(--ink2);margin:20px 0 0;max-width:52ch}
.hdeck b{color:var(--ink);font-weight:600}
.hfig{border-left:1px solid var(--line);padding-left:30px}
.hfignum{font-family:var(--serif);font-weight:500;font-size:clamp(52px,6.4vw,84px);line-height:.92;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hfignum .u{font-size:.42em;color:var(--copper);vertical-align:.28em;margin-left:2px}
.hfigl{font-family:var(--mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-top:14px;line-height:1.5}
.hfigl b{color:var(--ink2)}
/* stat strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--line)}
.stripc{padding:22px 0 22px 26px;border-left:1px solid var(--line)}
.stripc:first-child{padding-left:0;border-left:none}
.stripv{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.stripl{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-top:9px}
.stripd{font-family:var(--mono);font-size:12px;margin-top:5px}
/* section */
.sec{padding:64px 0 0}
.sechead{max-width:64ch}
.sectitle{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.1;color:var(--ink);margin:12px 0 0;letter-spacing:-.01em}
.secdeck{font-size:16.5px;line-height:1.65;color:var(--ink2);margin:14px 0 0;max-width:66ch}
.note{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:14px;letter-spacing:.2px}
/* scorecard */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:30px}
.scol{}
.scolh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.scolh.up{border-color:var(--up)} .scolh.stable{border-color:var(--copper)} .scolh.down{border-color:var(--down)}
.scolt{font-family:var(--serif);font-size:20px;color:var(--ink)}
.scolh.up .scolt{color:var(--up)} .scolh.stable .scolt{color:var(--copper2)} .scolh.down .scolt{color:var(--down)}
.scolc{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.srow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;font-family:inherit;color:inherit;transition:padding-left .15s,background .15s}
.srow:hover{background:rgba(184,115,51,.06);padding-left:8px}
.srn{font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:9px}
.srn i{width:6px;height:6px;border-radius:50%;flex:none}
.srv{font-family:var(--serif);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.srg{font-family:var(--mono);font-size:12px;width:56px;text-align:right;font-variant-numeric:tabular-nums}
.srow .arr{opacity:0;color:var(--copper);font-family:var(--mono);margin-left:-4px;transition:opacity .15s}
.srow:hover .arr{opacity:1}
/* area chart */
.arcwrap{margin-top:28px;border:1px solid var(--line);border-radius:2px;background:var(--card);padding:24px 26px 14px}
.arc{width:100%;height:230px;display:block;overflow:visible}
.arclab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;color:var(--mut);margin-top:8px}
.arckey{display:flex;gap:20px;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-bottom:16px}
.arckey i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:7px}
/* quadrant */
.qwrap{margin-top:30px;border:1px solid var(--line);border-radius:2px;background:var(--card);padding:22px 26px 14px;position:relative}
.qplot{position:relative;width:100%;height:480px}
.qaxL{position:absolute;left:0;top:0;bottom:28px;width:1px;background:var(--line2)}
.qaxB{position:absolute;left:0;right:0;bottom:28px;height:1px;background:var(--line2)}
.qref{position:absolute;left:0;right:0;height:1px;border-top:1px dashed var(--line2)}
.qreflab{position:absolute;right:2px;font-family:var(--mono);font-size:10px;color:var(--mut);transform:translateY(-13px)}
.qcorn{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--line2);pointer-events:none}
.qbub{position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;transition:transform .15s;border:1.5px solid}
.qbub:hover{transform:translate(-50%,-50%) scale(1.06);z-index:6}
.qbub.rca{box-shadow:0 0 0 3px rgba(184,115,51,.16)}
.qlab{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9.5px;color:var(--ink2);pointer-events:none;white-space:nowrap}
.qtk{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.qaxt{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.qleg{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:12px}
.qleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* segment detail */
.detail{border:1px solid var(--copper);border-radius:2px;background:var(--card);padding:24px 26px;margin-top:20px;display:none}
.detail.on{display:block;animation:dfade .4s ease}
@keyframes dfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dt{font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1.1}
.dtag{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--copper2);margin-bottom:4px}
.dnar{font-size:16px;line-height:1.6;color:var(--ink2);margin:14px 0 0;max-width:70ch}
.dnar b{color:var(--ink);font-weight:600}
.dcurve{width:100%;height:150px;display:block;margin:18px 0 6px}
.dtable{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:8px;border:1px solid var(--line)}
.dcell{padding:12px 10px;text-align:center;border-left:1px solid var(--line)}
.dcell:first-child{border-left:none;background:rgba(184,115,51,.05)}
.dcy{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.dcv{font-family:var(--serif);font-size:19px;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.dcg{font-family:var(--mono);font-size:11.5px;margin-top:2px}
.ddrv{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:14px;letter-spacing:.2px}
.dclose{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);background:none;border:1px solid var(--line2);border-radius:2px;padding:7px 12px;cursor:pointer}
.dclose:hover{color:var(--ink);border-color:var(--ink2)}
/* indicators */
.indrow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:30px;border:1px solid var(--line);border-bottom:none;border-radius:2px 2px 0 0;background:var(--card)}
.indrow4{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:0 0 2px 2px;background:var(--card)}
.ind{padding:22px 24px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.indrow .ind:nth-child(-n+3){border-top:none}
.indrow .ind:nth-child(3n+1){border-left:none}
.indrow4 .ind:nth-child(4n+1){border-left:none}
.indt{font-family:var(--serif);font-size:17px;color:var(--ink)}
.indsub{font-family:var(--mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-top:2px}
.indv{font-family:var(--serif);font-size:30px;color:var(--ink);margin:12px 0 2px;line-height:1;font-variant-numeric:tabular-nums}
.indd{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.gauge{margin:14px 0 2px}
.gbar{height:7px;border-radius:4px;background:linear-gradient(90deg,#c58a80,#d9c9a6 46%,#a9c6b3 54%,#7fae93);position:relative}
.gmark{position:absolute;top:-4px;width:2.5px;height:15px;background:var(--ink);border-radius:2px}
.g50{position:absolute;top:-2px;left:50%;width:1px;height:11px;background:rgba(30,42,56,.35)}
.gscale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:7px}
.spark{display:flex;align-items:flex-end;gap:5px;height:38px;margin:12px 0 2px}
.sbar{flex:1;border-radius:2px 2px 0 0;min-height:3px}
.asofm{font-family:var(--mono);font-size:9px;color:var(--mut);margin-top:8px;letter-spacing:.3px}
/* what changed */
.chwrap{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:26px;border:1px solid var(--line);border-radius:2px;background:var(--card)}
.chcol{padding:20px 26px}
.chcol:first-child{border-right:1px solid var(--line)}
.chh{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.chh.up{color:var(--up)}.chh.down{color:var(--down)}
.chrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.chk{font-family:var(--serif);font-size:18px;color:var(--ink)}
.chv{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.chv.up{color:var(--up)}.chv.down{color:var(--down)}
.chflip{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2px;color:var(--ink2)}
.chflip b{color:var(--ink);font-weight:500}
/* metro permits */
.metrowrap{margin-top:26px}
.metrogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.mrow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrank{font-family:var(--mono);font-size:11px;color:var(--mut);width:18px;text-align:right;flex:0 0 18px}
.mname{font-family:var(--serif);font-size:16px;color:var(--ink);width:118px;flex:0 0 118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtrack{flex:1;height:8px;background:var(--paper2);border-radius:5px;overflow:hidden}
.mfill{display:block;height:100%;background:var(--blue);border-radius:5px}
.mval{font-family:var(--mono);font-size:12px;color:var(--ink2);width:40px;text-align:right;flex:0 0 40px;font-variant-numeric:tabular-nums}
.mchip{font-family:var(--mono);font-size:11px;width:50px;text-align:right;flex:0 0 50px;font-variant-numeric:tabular-nums}
.mchip.up{color:var(--up)}.mchip.down{color:var(--down)}
/* share card button */
.sharebtn{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--copper2);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:5px 11px;cursor:pointer;margin-left:16px;transition:.15s}
.sharebtn:hover{border-color:var(--copper);color:var(--copper)}
/* method */
.method{margin-top:30px;display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:start;border:1px solid var(--line);border-radius:2px;background:var(--card);padding:28px 30px}
.steps{counter-reset:s}
.step{counter-increment:s;position:relative;padding-left:38px;margin:14px 0;font-size:15px;line-height:1.6;color:var(--ink2)}
.step b{color:var(--ink)}
.step:before{content:counter(s);position:absolute;left:0;top:-1px;font-family:var(--mono);font-size:12px;color:var(--copper2);width:24px;height:24px;border:1px solid var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center}
.scen{margin-top:6px}
.scenh{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.scbtn{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:14px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:2px;padding:12px 14px;cursor:pointer;margin-bottom:8px;transition:.15s}
.scbtn:hover{border-color:var(--copper)}
.scbtn.on{border-color:var(--copper);background:rgba(184,115,51,.07);color:var(--ink)}
.scbtn b{font-family:var(--serif);font-size:15px}
.scbtn .sd{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:3px}
/* scrubber */
.chartwrap{margin-top:28px;border:1px solid var(--line);border-radius:2px;background:var(--card);padding:24px 26px}
.bar{display:flex;align-items:center;gap:14px;padding:5px 0}
.barname{width:150px;flex:none;font-size:13.5px;color:var(--ink)}
.bartrack{flex:1;height:18px;background:var(--paper2);border-radius:2px;position:relative;overflow:hidden}
.barfill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,.7,.3,1)}
.barval{width:60px;flex:none;text-align:right;font-family:var(--serif);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tmhead{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.tmdate{font-family:var(--serif);font-size:32px;color:var(--ink);line-height:1;min-width:120px;font-variant-numeric:tabular-nums}
.tmlead{font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--ink2)}
.tmlead b{color:var(--copper2)}
.tmbar{display:flex;align-items:center;gap:14px;margin-top:16px}
.tmplay{font-family:var(--mono);font-size:12px;width:40px;height:34px;flex:none;color:var(--ink2);background:none;border:1px solid var(--line2);border-radius:2px;cursor:pointer}
.tmplay:hover{border-color:var(--copper)}
.tmplay.on{background:var(--copper);border-color:var(--copper);color:#fff}
#tmrange{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--copper) 0%,var(--copper) var(--p,100%),var(--line2) var(--p,100%));outline:none;cursor:pointer}
#tmrange::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--copper);border:2px solid var(--paper);cursor:grab}
#tmrange::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--copper);border:2px solid var(--paper);cursor:grab}
/* map */
.maptop{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:10px}
.mlyrs{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.mlyr{font-family:var(--sans);font-size:13px;color:var(--ink2);background:transparent;border:none;border-right:1px solid var(--line);padding:8px 16px;cursor:pointer;display:flex;flex-direction:column;line-height:1.2;text-align:left}
.mlyr:last-child{border-right:none}
.mlyr span{font-family:var(--mono);font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-top:1px}
.mlyr.on{background:rgba(184,115,51,.09);color:var(--ink)}
.mlyr.on span{color:var(--copper2)}
.mback{font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--copper2);background:transparent;border:1px solid var(--line2);border-radius:2px;padding:7px 13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.mback.on{opacity:1;pointer-events:auto}.mback:hover{border-color:var(--copper);color:var(--copper)}
.mapstage{margin-top:16px;border:1px solid var(--line);border-radius:2px;background:var(--card);padding:14px}
#usmap{width:100%;height:auto;display:block;aspect-ratio:1015/594}
.stpath{stroke:#FAF8F5;stroke-width:1;cursor:pointer;transition:fill .3s,opacity .15s}
.stpath:hover{opacity:.82;stroke:var(--copper);stroke-width:1.4}
.stpath.sel{stroke:var(--copper);stroke-width:2}
.maplegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:14px;font-family:var(--mono);font-size:10px;color:var(--mut);justify-content:center}
.legsw{display:inline-flex;align-items:center;gap:5px}
.legsw i{width:17px;height:11px;border-radius:1px;display:inline-block}
.legunit{color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-left:4px}
.statepanel{max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .3s;margin-top:0}
.statepanel.on{max-height:1600px;opacity:1;margin-top:22px}
.sph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
.spname{font-family:var(--serif);font-size:27px;color:var(--ink);margin-top:2px}
.sptiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-top:none;border-radius:0 0 2px 2px;background:var(--card)}
.sptile{padding:16px 18px;border-left:1px solid var(--line)}
.sptile:first-child{border-left:none}
.sptv{font-family:var(--serif);font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.sptv.up{color:var(--up)}.sptv.down{color:var(--down)}
.sptl{font-family:var(--mono);font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-top:5px}
.spsec{margin-top:20px}
.sptr{width:100%;height:90px;display:block;margin-top:8px}
.spmetros{margin-top:8px}
/* read callout */
.read{margin-top:20px;border-left:2px solid var(--copper);padding:2px 0 2px 16px}
.readh{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--copper2);margin-bottom:5px}
.readp{font-size:15px;line-height:1.6;color:var(--ink2)}
.readp b{color:var(--ink);font-weight:600}
/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ink);color:#F5F1EA;border-radius:3px;padding:9px 12px;font-family:var(--mono);font-size:11px;max-width:260px;box-shadow:0 10px 30px rgba(30,42,56,.22)}
#tip .tt{color:#fff;font-size:12px;margin-bottom:3px;font-family:var(--sans);font-weight:600}
#tip b.up{color:#8FD3AC}#tip b.down{color:#E7A79C}
/* footer */
footer{margin-top:80px;border-top:1px solid var(--line);padding-top:26px;color:var(--mut);font-size:13px;line-height:1.7}
footer .fbrand{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px}
footer .src{font-family:var(--mono);font-size:11px;line-height:1.8;margin-top:8px}
@media(max-width:860px){
 .wrap{padding:0 20px 80px}
 .hero{grid-template-columns:1fr;gap:26px;align-items:start}
 .hfig{border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:22px}
 .strip{grid-template-columns:1fr}.stripc{border-left:none;border-top:1px solid var(--line);padding-left:0}.stripc:first-child{border-top:none}
 .score{grid-template-columns:1fr;gap:20px}
 .indrow,.indrow4{grid-template-columns:1fr}.ind{border-left:none;border-top:1px solid var(--line)}.indrow .ind:first-child{border-top:none}
 .method{grid-template-columns:1fr;gap:24px}
 .qplot{height:400px}.barname{width:108px}
 .chwrap{grid-template-columns:1fr}.chcol:first-child{border-right:none;border-bottom:1px solid var(--line)}
 .metrogrid{grid-template-columns:1fr;gap:0}
 .sptiles{grid-template-columns:repeat(2,1fr)}.sptile:nth-child(3),.sptile:nth-child(4){border-top:1px solid var(--line)}.sptile:nth-child(odd){border-left:none}
 .maptop{flex-direction:column;align-items:stretch}
}

const SCEN={base:0.60,momentum:0.85,trend:0.35};
function forecast(yoy,tr,w){
 const gm=clamp(yoy,-0.20,0.22);
 let y1=clamp(w*gm+(1-w)*tr,-0.22,0.22);
 const anchor=clamp(0.5*tr+0.5*0.045,-0.01,0.09);
 const g=[]; let cur=y1;
 for(let i=0;i<4;i++){g.push(cur);cur=cur+(anchor-cur)*0.5;}
 let lvl=1; g.forEach(x=>lvl*=1+x);
 return {g,cagr:Math.pow(lvl,1/4)-1};
}
const fc=s=>forecast(s.yoy,s.tr,W);
const cls=y=>y>=0.05?"up":(y<0?"down":"stable");
const ALL=()=>SEG.concat(RES);

/* ---- narrative, written from the live numbers ---- */
function monthlyRead(){
 const a=ALL();
 const g=a.filter(s=>cls(s.yoy)==='up').length, st=a.filter(s=>cls(s.yoy)==='stable').length;
 const up=a.slice().sort((x,y)=>y.yoy-x.yoy)[0], dn=a.slice().sort((x,y)=>x.yoy-y.yoy)[0];
 const t=AGG.total/1000;
 const dir=AGG.totYoY>0.015?'growing':(AGG.totYoY<-0.015?'easing':'about flat');
 const reason={Manufacturing:'as the semiconductor and battery build-out moves past its heavy-spend phase',Office:'on data centers',Power:'on grid and data-center load',Conservation:'on US Army Corps civil works',Religious:'on a handful of large campus projects','Health care':'as work shifts into existing buildings',Lodging:'as new hotel starts stay thin'};
 const dnR=reason[dn.k]?(' '+reason[dn.k]):'', upR=reason[up.k]?(', '+reason[up.k].replace(/^as /,'')):'';
 const headline=AGG.totYoY>0.015?'Growing on top.<br>Uneven underneath.':(AGG.totYoY<-0.015?'Easing on top.<br>Splitting underneath.':'Flat on top.<br><em>Splitting underneath.</em>');
 const deck=`US construction is running at a <b>$${t.toFixed(2)} trillion</b> annual pace, ${dir} over the past year. ${g+st} of ${a.length} segments are growing or holding. <b>${dn.k}</b> is the drag, down ${Math.abs(dn.yoy*100).toFixed(0)}%${dnR}. <b>${up.k}</b> leads at ${PCT(up.yoy)}${upR}.`;
 return {headline,deck};
}
function segNarr(s){
 const f=fc(s);
 const now=s.yoy>=0.05?`Running hot, up ${(s.yoy*100).toFixed(0)}% over the year`:(s.yoy<0?`Cooling, down ${Math.abs(s.yoy*100).toFixed(0)}% over the year`:`Holding, ${PCT(s.yoy)} over the year`);
 const fwd=f.cagr>0.06?`the trend points to a strong five years, near ${(f.cagr*100).toFixed(0)}% a year`:(f.cagr<0.015?`the projection stays soft, near ${(f.cagr*100).toFixed(0)}% a year`:`the projection eases to about ${(f.cagr*100).toFixed(0)}% a year`);
 return `${now}. From here, ${fwd}.`;
}

/* ---- what changed this month ---- */
function changesData(){
 const live=SEG.some(s=>SERIES[s.fred]&&SERIES[s.fred].length>1);
 if(live){
  const rows=SEG.map(s=>{const a=SERIES[s.fred]; if(!a||a.length<2)return null; const x=a.map(p=>p[1]);
    return {k:s.k,d:+((x[x.length-1]-x[x.length-2])/1000).toFixed(1)};}).filter(Boolean);
  const flips=[]; const LBL={up:'Growing',stable:'Holding',down:'Cooling'};
  SEG.forEach(s=>{const a=SERIES[s.fred]; if(!a||a.length<14)return; const x=a.map(p=>p[1]);
    const cn=cls(x[x.length-1]/x[x.length-13]-1), cp=cls(x[x.length-2]/x[x.length-14]-1);
    if(cn!==cp)flips.push(`<b>${s.k}</b> moved from ${LBL[cp]} to ${LBL[cn]}`);});
  return {mode:'mom',asof:AGG.asof,
    gain:rows.slice().sort((a,b)=>b.d-a.d).slice(0,3),
    give:rows.slice().sort((a,b)=>a.d-b.d).slice(0,3), flips};
 }
 return {mode:'yoy',asof:AGG.asof,
   gain:SEG.slice().sort((a,b)=>b.yoy-a.yoy).slice(0,3).map(s=>({k:s.k,p:s.yoy})),
   give:SEG.slice().sort((a,b)=>a.yoy-b.yoy).slice(0,3).map(s=>({k:s.k,p:s.yoy})), flips:[]};
}
function whatChangedSec(){
 const c=changesData();
 const row=o=>{const neg=o.d!=null?o.d<0:o.p<0; const val=o.d!=null?((o.d>=0?'+':'-')+'$'+Math.abs(o.d).toFixed(1)+'B'):PCT(o.p);
   return `<div class="chrow"><span class="chk">${o.k}</span><span class="chv ${neg?'down':'up'}">${val}</span></div>`;};
 const lead=c.mode==='mom'?`Dollar change from the prior month, off the ${c.asof} Census release.`:`Change over the past year. Live monthly deltas load with the data.`;
 const flip=c.flips.length?`<div class="chflip">${c.flips.map(f=>`<span>&#8646;&nbsp; ${f}</span>`).join('')}</div>`:`<div class="chflip"><span>No segment changed camp this month.</span></div>`;
 return `<section class="sec rv">${secHead('What changed','The month, at a glance',lead)}
  <div class="chwrap">
   <div class="chcol"><div class="chh up">Added the most spend</div>${c.gain.map(row).join('')}</div>
   <div class="chcol"><div class="chh down">Gave back the most</div>${c.give.map(row).join('')}</div>
  </div>${flip}
 </section>`;
}

function wireRows(){ $$('.srow').forEach(b=>b.onclick=()=>openDetail(b.dataset.seg)); }
function openDetail(key,keepScroll){
 const s=ALL().find(x=>x.k===key); if(!s)return; openKey=key;
 const f=fc(s), years=[2027,2028,2029,2030]; let lvl=s.lvl;
 const path=[{y:2026,g:s.yoy,l:s.lvl}]; f.g.forEach((g,i)=>{lvl*=1+g;path.push({y:years[i],g,l:lvl});});
 const cells=path.map(p=>`<div class="dcell"><div class="dcy">${p.y}${p.y===2026?' now':''}</div><div class="dcv">$${p.l.toFixed(0)}B</div><div class="dcg ${p.g>0?'up':(p.g<0?'down':'flat')}">${PCT(p.g)}</div></div>`).join('');
 const d=$('#detail');
 d.innerHTML=`<div class="dh"><div><div class="dtag">${GLBL[s.grp]} &middot; ${PCT(f.cagr)} projected CAGR</div><div class="dt">${s.k}</div></div><button class="dclose" id="dclose">Close</button></div>`
  +`<div class="dnar">${segNarr(s)}</div>`+drawCurve(s,path)
  +`<div class="dtable">${cells}</div><div class="ddrv">Drivers: ${s.drv}.</div>`;
 d.classList.add('on'); $('#dclose').onclick=()=>{d.classList.remove('on');openKey=null;};
 if(!keepScroll)d.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function drawCurve(s,path){
 const W2=1040,H=150,pad=8, hist=SERIES[s.fred];
 let pts=hist&&hist.length?hist.slice(-120).map(p=>p[1]/1000):[];
 const fwd=path.map(p=>p.l), all=pts.concat(fwd), mn=Math.min(...all)*0.9, mx=Math.max(...all)*1.06;
 const X=i=>pad+i/(all.length-1)*(W2-2*pad), Y=v=>H-pad-((v-mn)/(mx-mn))*(H-2*pad);
 let dh=''; pts.forEach((v,i)=>dh+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ');
 const off=pts.length; let df='M'+X(Math.max(0,off-1)).toFixed(1)+' '+Y(pts.length?pts[off-1]:fwd[0]).toFixed(1)+' ';
 fwd.forEach((v,i)=>df+='L'+X(off-1+i+(pts.length?0:0)).toFixed(1)+' '+Y(v).toFixed(1)+' ');
 return `<svg class="dcurve" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none">
   ${pts.length?`<path d="${dh}" fill="none" stroke="var(--ink)" stroke-width="2"/>`:''}
   <path d="${df}" fill="none" stroke="var(--copper)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/></svg>`
  +(pts.length?'':`<div class="note" style="margin-top:2px">Live history loads with the page; the dashed line is the projection.</div>`);
}

/* ---- the arc (total put in place) ---- */
function drawArc(){
 const svg=$('#arc'); if(!svg)return;
 const W2=1080,H=230,pad=6;
 const s=SERIES['TTLCONS'];
 let hist = s&&s.length ? s.filter((_,i)=>i%3===0||i===s.length-1).map(p=>({t:+p[0].slice(0,4)+(+p[0].slice(5,7)-1)/12, v:p[1]/1000})) : ARCFB.map(p=>({t:p[0],v:p[1]/1000}));
 const last=hist[hist.length-1];
 const f=forecast(AGG.totYoY,AGG.totTr,W); let lv=last.v; const fwd=[{t:last.t,v:last.v}];
 f.g.forEach((g,i)=>{lv*=1+g;fwd.push({t:Math.round(last.t)+i+1,v:lv});});
 const all=hist.concat(fwd), t0=all[0].t, t1=all[all.length-1].t, vmax=Math.max(...all.map(a=>a.v))*1.05;
 const X=t=>pad+(t-t0)/(t1-t0)*(W2-2*pad), Y=v=>H-16-(v/vmax)*(H-26);
 const line=arr=>arr.map((a,i)=>(i?'L':'M')+X(a.t).toFixed(1)+' '+Y(a.v).toFixed(1)).join(' ');
 const areaH=line(hist)+` L${X(last.t).toFixed(1)} ${(H-16).toFixed(1)} L${X(hist[0].t).toFixed(1)} ${(H-16).toFixed(1)} Z`;
 const areaF=line(fwd)+` L${X(fwd[fwd.length-1].t).toFixed(1)} ${(H-16).toFixed(1)} L${X(last.t).toFixed(1)} ${(H-16).toFixed(1)} Z`;
 svg.innerHTML=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2A38" stop-opacity=".14"/><stop offset="1" stop-color="#1E2A38" stop-opacity="0"/></linearGradient>
   <linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B87333" stop-opacity=".16"/><stop offset="1" stop-color="#B87333" stop-opacity="0"/></linearGradient></defs>
  <path d="${areaF}" fill="url(#af)"/><path d="${areaH}" fill="url(#ag)"/>
  <path d="${line(fwd)}" fill="none" stroke="#B87333" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" opacity=".85"/>
  <path d="${line(hist)}" fill="none" stroke="#1E2A38" stroke-width="2.5"/>`;
 $('#arclab').innerHTML=`<span>${Math.round(t0)}</span><span>2020</span><span>${Math.round(last.t)} &middot; now</span><span>2030 proj</span>`;
}

/* ---- quadrant ---- */

/* ---- scrubber ---- */
function initScrubber(){
 const el=id=>document.getElementById(id); let dates=[],data={},MAX=1,idx=0,playing=false,timer=null;
 const withS=SEG.filter(s=>SERIES[s.fred]&&SERIES[s.fred].length);
 if(!withS.length){el('tmhint').textContent='Live monthly history was not reachable. The rest of the page still reflects the latest release.';return;}
 const base=withS[0].fred; dates=SERIES[base].map(p=>{const d=p[0].split('-');return MON[+d[1]-1]+' '+d[0];});
 withS.forEach(s=>{const m={};SERIES[s.fred].forEach((p,i)=>m[i]=p[1]/1000);data[s.k]=dates.map((_,i)=>m[i]!=null?m[i]:null);});
 Object.values(data).forEach(a=>a.forEach(v=>{if(v>MAX)MAX=v;}));
 function draw(){
  const cur=withS.map(s=>({k:s.k,v:data[s.k][idx]})); let lead={k:'',v:-1}; cur.forEach(o=>{if(o.v>lead.v)lead=o;});
  el('tmdate').textContent=dates[idx]||''; el('tmlead').innerHTML=lead.v>0?('Leading &middot; <b>'+lead.k+'</b> $'+lead.v.toFixed(0)+'B a year'):'';
  el('tmchart').innerHTML=cur.sort((a,b)=>b.v-a.v).slice(0,10).map(o=>{const col=o.k===lead.k?'var(--copper)':'#C9A784';
   return '<div class="bar"><div class="barname">'+o.k+'</div><div class="bartrack"><div class="barfill" style="width:'+(o.v/MAX*100).toFixed(1)+'%;background:'+col+'"></div></div><div class="barval">$'+(o.v!=null?o.v.toFixed(0):'-')+'B</div></div>';}).join('');
  el('tmrange').style.setProperty('--p',(dates.length>1?idx/(dates.length-1)*100:100)+'%');
 }
 function setIdx(i){idx=clamp(i,0,dates.length-1);el('tmrange').value=idx;draw();}
 function stop(){playing=false;clearInterval(timer);const b=el('tmplay');b.classList.remove('on');b.innerHTML='&#9654;';}
 function play(){if(playing){stop();return;}playing=true;const b=el('tmplay');b.classList.add('on');b.innerHTML='&#10073;&#10073;';if(idx>=dates.length-1)setIdx(0);timer=setInterval(()=>{if(idx>=dates.length-1){stop();return;}setIdx(idx+1);},90);}
 el('tmrange').max=dates.length-1; el('tmrange').oninput=function(){stop();setIdx(+this.value);}; el('tmplay').onclick=play;
 el('tmhint').innerHTML='Live monthly data via FRED. Drag the handle or press play.'; setIdx(dates.length-1);
}

/* ---- geographic map: live permits + data-center layers, drill to metros ---- */
const SDC={WA:100,NY:125,OR:144,NV:134,IA:111,IL:250,IN:120,OH:250,PA:257,CA:212,UT:156,VA:954,AZ:254,GA:458,TX:962};
const NATVB={x:-58,y:13,w:1015,h:594};
function mapVals(){ if(MAP.layer==='dc')return SDC; const o={}; Object.keys(SPERM).forEach(c=>o[c]=SPERM[c][0]); return o; }
// magnitude reads as a cool sequential ramp (never a warm hue that looks like "bad"),
// binned into labeled classes so each shade maps to a real range.
const BLUE5=['#D6E4F2','#A9C6E4','#6E9BCB','#3C74AC','#22507B'];
const NODATA='#EAE4D8';
const BINS={permits:[5000,15000,35000,75000], dc:[50,150,300,500]};
const BINLBL={permits:['<5k','5-15k','15-35k','35-75k','75k+'], dc:['<50','50-150','150-300','300-500','500+']};
function binIdx(v){ const br=BINS[MAP.layer]; let i=0; while(i<br.length&&v>=br[i])i++; return i; }
function fillFor(v){ return v?BLUE5[binIdx(v)]:NODATA; }
function mapTip(code,v){ const nm=SGEO[code]?SGEO[code].n:code;
 if(MAP.layer==='dc')return {t:nm,b:v?`<b class="up">${v}</b> data centers in the pipeline`:'Outside the tracked top 15'};
 const yo=SPERM[code]?SPERM[code][1]:0; return {t:nm,b:`<b>${(v||0).toLocaleString()}</b> housing permits, last 12 months<br><b class="${yo>=0?'up':'down'}">${yo>=0?'+':''}${(yo*100).toFixed(0)}%</b> year over year`}; }
function fitVB(b){ const AR=NATVB.w/NATVB.h; let w=((b[2]-b[0])||30)*1.4, h=((b[3]-b[1])||30)*1.4; if(w/h<AR)w=h*AR; else h=w/AR; return {x:(b[0]+b[2])/2-w/2,y:(b[1]+b[3])/2-h/2,w,h}; }
function animateVB(svg,to,dur){ const f=svg.viewBox.baseVal, s={x:f.x,y:f.y,w:f.width,h:f.height}, t0=performance.now();
 (function tick(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
  svg.setAttribute('viewBox',`${s.x+(to.x-s.x)*e} ${s.y+(to.y-s.y)*e} ${s.w+(to.w-s.w)*e} ${s.h+(to.h-s.h)*e}`);
  if(p<1)requestAnimationFrame(tick);})(performance.now());
}
function reselect(){ $$('.stpath').forEach(p=>p.classList.toggle('sel',p.dataset.code===MAP.zoom)); }
function initMap(){
 const svg=$('#usmap'); if(!svg)return; svg.innerHTML='';
 const vals=mapVals(), max=Math.max(...Object.values(vals).map(v=>v||0),1);
 Object.keys(SGEO).forEach(code=>{
  const v=vals[code]||0, p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',SGEO[code].d); p.setAttribute('class','stpath'); p.setAttribute('vector-effect','non-scaling-stroke'); p.dataset.code=code;
  p.setAttribute('fill', fillFor(v));
  p.onpointerenter=e=>showTip(mapTip(code,v),e); p.onpointermove=move; p.onpointerleave=hideTip; p.onclick=()=>drillState(code);
  svg.appendChild(p);
 });
 const unit=MAP.layer==='dc'?'data centers, pipeline':'permits, last 12 mo';
 const lg=$('.maplegend'), lbls=BINLBL[MAP.layer];
 if(lg)lg.innerHTML=`<span class="legsw"><i style="background:${NODATA}"></i>none</span>`+BLUE5.map((c,i)=>`<span class="legsw"><i style="background:${c}"></i>${lbls[i]}</span>`).join('')+`<span class="legunit">${unit}</span>`;
 $$('.mlyr').forEach(b=>b.onclick=()=>{MAP.layer=b.dataset.layer;$$('.mlyr').forEach(x=>x.classList.toggle('on',x===b));initMap();});
 $('#mapback').onclick=resetZoom; $('#mapback').classList.toggle('on',!!MAP.zoom);
 if(MAP.zoom){const o=fitVB(SGEO[MAP.zoom].b);svg.setAttribute('viewBox',`${o.x} ${o.y} ${o.w} ${o.h}`);reselect();}
}
function drillState(code){ if(!SGEO[code])return; MAP.zoom=code; animateVB($('#usmap'),fitVB(SGEO[code].b),620); reselect(); $('#mapback').classList.add('on'); renderStatePanel(code); }
function resetZoom(){ MAP.zoom=null; const svg=$('#usmap'); if(svg)animateVB(svg,NATVB,560); $$('.stpath').forEach(p=>p.classList.remove('sel')); const mb=$('#mapback'); if(mb)mb.classList.remove('on'); const sp=$('#statepanel'); if(sp){sp.classList.remove('on');sp.innerHTML='';} }
function stateTrend(arr){
 const W2=520,H=90,pad=6, xs=arr.slice(-60), n=xs.length, mn=Math.min(...xs), mx=Math.max(...xs);
 const X=i=>pad+i/(n-1)*(W2-2*pad), Y=v=>H-pad-((v-mn)/((mx-mn)||1))*(H-2*pad);
 const d=xs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const area=d+` L${X(n-1).toFixed(1)} ${H-pad} L${X(0).toFixed(1)} ${H-pad} Z`;
 return `<svg class="sptr" viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none"><path d="${area}" fill="rgba(42,111,176,.10)"/><path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderStatePanel(code){
 const sp=$('#statepanel'); if(!sp)return; const nm=SGEO[code].n;
 const perm=SPERM[code]?SPERM[code][0]:null, yo=SPERM[code]?SPERM[code][1]:null;
 const rank=Object.entries(SPERM).sort((a,b)=>b[1][0]-a[1][0]).findIndex(e=>e[0]===code)+1;
 const dc=SDC[code]||0, tr=SPSERIES[code];
 const tiles=[
   ['Housing permits, 12 mo', perm!=null?perm.toLocaleString():'-',''],
   ['Year over year', yo!=null?((yo>=0?'+':'')+(yo*100).toFixed(0)+'%'):'-', yo!=null?(yo>=0?'up':'down'):''],
   ['Rank among states', rank?('#'+rank+' of 51'):'-',''],
   ['Data centers', dc?dc.toLocaleString():'-','']
 ].map(t=>`<div class="sptile"><div class="sptv ${t[2]}">${t[1]}</div><div class="sptl">${t[0]}</div></div>`).join('');
 const metros=METRO.filter(m=>MST[m.k]===code).sort((a,b)=>b.v-a.v);
 const mmax=metros.length?Math.max(...metros.map(m=>m.v)):1;
 const mbars=metros.map(m=>{const chip=m.yo!=null?`<span class="mchip ${m.yo>=0?'up':'down'}">${m.yo>=0?'+':''}${(m.yo*100).toFixed(0)}%</span>`:'';
   return `<div class="mrow"><span class="mname">${m.k}</span><span class="mtrack"><span class="mfill" style="width:${(m.v/mmax*100).toFixed(1)}%"></span></span><span class="mval">${(m.v/1000).toFixed(1)}k</span>${chip}</div>`;}).join('');
 sp.innerHTML=`<div class="sph"><div><div class="eyebrow">State detail</div><div class="spname">${nm}</div></div><button class="dclose" onclick="resetZoom()">Close</button></div>
  <div class="sptiles">${tiles}</div>
  ${tr&&tr.length>12?`<div class="spsec"><div class="chh">Permits, monthly, last five years</div>${stateTrend(tr)}</div>`:''}
  ${metros.length?`<div class="spsec"><div class="chh">Metros tracked in ${nm}</div><div class="spmetros">${mbars}</div></div>`:`<div class="note">No metro from the tracked set sits in ${nm}. The state totals above are live.</div>`}`;
 sp.classList.add('on'); sp.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---- motion ---- */
function motionIn(){
 const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
 $$('.rv').forEach((e,i)=>{const top=e.getBoundingClientRect().top; if(top<innerHeight){e.style.transitionDelay=(Math.min(i,6)*70)+'ms'; requestAnimationFrame(()=>e.classList.add('in'));} else io.observe(e);});
}
function countUp(){
 const el=$('#heroNum'); if(!el)return; const target=+el.dataset.val; const t0=performance.now(), dur=1100;
 function tick(t){const p=clamp((t-t0)/dur,0,1); const e=1-Math.pow(1-p,3); el.innerHTML=`$${(target*e).toFixed(2)}<span class="u">T</span>`; if(p<1)requestAnimationFrame(tick); else el.innerHTML=heroNumHTML();}
 requestAnimationFrame(tick);
}

/* ---- shareable card (LinkedIn), drawn client-side ---- */
function wrapText(x,txt,left,top,maxw,lh){
 const words=txt.split(' '); let line='',y=top;
 for(const w of words){const test=line?line+' '+w:w;
   if(x.measureText(test).width>maxw&&line){x.fillText(line,left,y);line=w;y+=lh;}else line=test;}
 if(line)x.fillText(line,left,y); return y;
}

/* ---- live refresh ---- */
async function fetchLive(){
 try{
  const ids=SEG.map(s=>s.fred).concat(['TTLCONS','TLRESCONS','TLNRESCONS']).join(',');
  const r=await fetch('/api/fred?series='+ids+'&start=2007-01-01&freq=m',{cache:'no-store'});
  if(!r.ok)throw 0; const j=await r.json(); if(!j.ok||!j.series)throw 0; SERIES=j.series;
  SEG.forEach(s=>{const a=SERIES[s.fred]; if(a&&a.length>13){const x=a.map(p=>p[1]);s.lvl=+(x[x.length-1]/1000).toFixed(1);s.yoy=+(x[x.length-1]/x[x.length-13]-1).toFixed(4);const k=Math.min(121,x.length);s.tr=+(Math.pow(x[x.length-1]/x[x.length-k],12/(k-1))-1).toFixed(4);}});
  const tot=SERIES['TTLCONS'],res=SERIES['TLRESCONS'];
  if(tot&&tot.length>13){AGG.total=+(tot[tot.length-1][1]/1000).toFixed(1);AGG.totYoY=+(tot[tot.length-1][1]/tot[tot.length-13][1]-1).toFixed(4);const k=Math.min(121,tot.length);AGG.totTr=+(Math.pow(tot[tot.length-1][1]/tot[tot.length-k][1],12/(k-1))-1).toFixed(4);const d=tot[tot.length-1][0].split('-');AGG.asof=MON[+d[1]-1]+' '+d[0];}
  if(res&&res.length){AGG.res=+(res[res.length-1][1]/1000).toFixed(1);
   const rs=RES.reduce((a,x)=>a+x.lvl,0); if(rs>0)RES.forEach(x=>x.lvl=+(x.lvl/rs*AGG.res).toFixed(0));}
  AGG.nrb=SEG.filter(s=>s.grp==='nrb').reduce((a,x)=>a+x.lvl,0);
  AGG.nb=SEG.filter(s=>s.grp==='nb').reduce((a,x)=>a+x.lvl,0);
  LIVE=true; render(); const pl=$('#pulse'); if(pl)pl.classList.add('on');
 }catch(e){}
 try{
  const r=await fetch('/api/fred?series=MORTGAGE30US,WPUSI012011,HOUST&start=2024-01-01&freq=m',{cache:'no-store'});
  if(r.ok){const j=await r.json(); if(j.ok){const gg=(id,f)=>{const a=j.series[id];if(a&&a.length)f(a);};
   gg('MORTGAGE30US',a=>IND.rate.v=a[a.length-1][1]); gg('WPUSI012011',a=>{if(a.length>12)IND.ppi.v=+(a[a.length-1][1]/a[a.length-13][1]-1).toFixed(3);}); gg('HOUST',a=>IND.starts.v=+(a[a.length-1][1]/1000).toFixed(2)); render();}}
 }catch(e){}
 try{
  const mids=METRO.map(m=>m.f).join(',');
  const r=await fetch('/api/fred?series='+mids+'&start=2023-01-01&freq=m',{cache:'no-store'});
  if(r.ok){const j=await r.json(); if(j.ok&&j.series){MSERIES=j.series; let asof='';
   METRO.forEach(m=>{const a=MSERIES[m.f]; if(a&&a.length>=24){const x=a.map(p=>p[1]);
     const ttm=sumA(x.slice(-12)), prev=sumA(x.slice(-24,-12));
     m.v=Math.round(ttm); if(prev)m.yo=+(ttm/prev-1).toFixed(3); asof=a[a.length-1][0];}});
   if(asof){const d=asof.split('-');METRO_ASOF=MON[+d[1]-1]+' '+d[0];}
   METRO.sort((a,b)=>b.v-a.v); render();}}
 }catch(e){}
 try{
  const sids=Object.keys(SGEO).map(c=>c+'BPPRIV').join(',');
  const r=await fetch('/api/fred?series='+sids+'&start=2019-01-01&freq=m',{cache:'no-store'});
  if(r.ok){const j=await r.json(); if(j.ok&&j.series){
   Object.keys(SGEO).forEach(c=>{const a=j.series[c+'BPPRIV']; if(a&&a.length>=24){const x=a.map(p=>p[1]);
     const ttm=sumA(x.slice(-12)), prev=sumA(x.slice(-24,-12));
     SPERM[c]=[Math.round(ttm), prev?+(ttm/prev-1).toFixed(3):0]; SPSERIES[c]=x.slice(-60);}});
   if(!MAP.zoom)render();}}
 }catch(e){}
}
