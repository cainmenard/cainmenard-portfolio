<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Operation OneRoof · Business Readiness</title>
<meta name="description" content="The business-readiness story behind RCA's roll-up onto one system, stage by stage. Built by Cain Menard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#FAF8F5; --paper2:#F1ECE3; --card:#FFFDFA; --ink:#1E2A38; --ink2:#3C4859; --mut:#8B8578;
 --copper:#B87333; --copper2:#9A571F; --line:#E6DFD3; --line2:#D8CFBF;
 --up:#3F7A57; --down:#B0483B; --steel:#2A6FB0; --amber:#C68A3C;
 --serif:'Newsreader',Georgia,'Times New Roman',serif;
 --sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
 background:radial-gradient(120% 70% at 50% -8%,#FFFFFF 0%,var(--paper) 48%,var(--paper2) 100%) fixed;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(184,115,51,.2)}
a{color:var(--copper2);text-decoration:none;border-bottom:1px solid rgba(154,87,31,.3)}
a:hover{border-color:var(--copper2)}
.wrap{max-width:1180px;margin:0 auto;padding:0 34px 120px;position:relative}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--copper2)}

.bpimmersive{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#8FB1CC;border:none;text-align:center;margin-top:10px;border-top:1px solid rgba(127,166,196,.18);padding-top:11px}
.bpimmersive:hover{color:#EAF1F8}
/* nav */
#topnav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 34px;background:rgba(250,248,245,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .32s cubic-bezier(.22,.61,.36,1)}
#topnav.show{transform:translateY(0)}
.nbrand{font-family:var(--serif);font-size:17px;color:var(--ink);border:none;white-space:nowrap}
.nbrand b{color:var(--copper);font-weight:500}
.nlinks{display:flex;gap:17px;margin-left:auto}
.nlinks a{font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);border:none;padding:4px 0;position:relative;white-space:nowrap;transition:color .15s}
.nlinks a:hover{color:var(--ink2)}
.nlinks a.on{color:var(--copper2)}
.nlinks a.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--copper)}

/* hero */
.hero{padding:96px 0 40px;border-bottom:1px solid var(--line)}
.h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,6vw,74px);line-height:1.02;letter-spacing:-.015em;margin:16px 0 0;max-width:16ch}
.h1 em{font-style:italic;color:var(--copper2)}
.hlede{font-size:19px;line-height:1.6;color:var(--ink2);margin:24px 0 0;max-width:60ch}
.hmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-top:26px}
.hkpi{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:40px;border:1px solid var(--line);border-radius:2px;background:var(--card)}
.hkpi .k{padding:20px 22px;border-left:1px solid var(--line)}
.hkpi .k:first-child{border-left:none}
.hkpi .kv{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.hkpi .kl{font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin-top:8px;line-height:1.4}
.herotools{display:flex;flex-wrap:wrap;align-items:center;gap:9px 11px;margin-top:24px}
.herotools .htl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.htool{font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--copper2);border:1px solid var(--line2);border-radius:2px;padding:6px 11px;background:var(--card);white-space:nowrap;transition:border-color .15s,color .15s}
.htool:hover{border-color:var(--copper);color:var(--copper)}
.htool i{font-style:normal;color:var(--up);font-size:8px;text-transform:uppercase;letter-spacing:.5px;margin-left:4px}
.toolsfab{position:fixed;right:20px;bottom:20px;z-index:70;font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--copper2);border:none;border-radius:3px;padding:11px 15px;box-shadow:0 8px 22px rgba(154,87,31,.30)}
.toolsfab:hover{background:var(--copper)}
@media(max-width:920px){.toolsfab{right:13px;bottom:13px;font-size:10px;padding:10px 13px}}

/* the build: two-column, sticky companion */
.build{display:grid;grid-template-columns:1fr 400px;gap:56px;align-items:start;margin-top:20px}
.stages{min-width:0}
.stage{padding:64px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:none}
.stfignum{font-family:var(--serif);font-size:clamp(44px,6vw,64px);line-height:1;color:var(--copper2);font-variant-numeric:tabular-nums}
.stfigl{font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.sttitle{font-family:var(--serif);font-weight:500;font-size:clamp(27px,3.2vw,38px);line-height:1.1;letter-spacing:-.01em;margin:20px 0 0}
.stps{font-size:17.5px;line-height:1.62;color:var(--ink2);margin:14px 0 0;max-width:54ch}
.mems{margin-top:26px;border-top:1px solid var(--line)}
.mem{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.memn{font-family:var(--serif);font-size:26px;color:var(--copper2);line-height:1;font-variant-numeric:tabular-nums}
.memk{font-family:var(--serif);font-size:18px;color:var(--ink)}
.memnote{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.5}
.stnd{margin-top:24px;font-family:var(--mono);font-size:12px;letter-spacing:.2px;color:var(--mut);border-left:2px solid var(--line2);padding-left:14px}
.stnd b{color:var(--ink2);font-weight:500}

/* sticky building companion (blueprint section) */
.buildco{position:sticky;top:92px}
.bpcard{border:1px solid #24405E;border-radius:3px;background:radial-gradient(130% 100% at 60% 0%,#243B54 0%,#152738 46%,#0C1B29 100%);padding:22px 22px 18px;box-shadow:0 20px 44px rgba(20,32,48,.18)}
.bphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bpk{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7FA6C4}
.bpc{font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;color:#5E7C97}
.bpt{font-family:var(--serif);font-size:19px;color:#EAF1F8;margin-bottom:14px;line-height:1.2}
.section{display:flex;flex-direction:column-reverse;gap:5px}
.layer{position:relative;border:1px solid rgba(127,166,196,.3);border-radius:2px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;transition:all .5s cubic-bezier(.32,.72,.16,1);opacity:.28}
.layer .lm{font-family:var(--mono);font-size:10.5px;letter-spacing:.3px;color:#9FB8CF}
.layer .lc{font-family:var(--mono);font-size:10px;color:#6E8CA8}
.layer.done{opacity:1;border-color:rgba(163,197,240,.55);background:linear-gradient(118deg,rgba(97,150,214,.26),rgba(97,150,214,.08))}
.layer.roofL{border-style:dashed;border-color:rgba(240,168,108,.85)}
.layer.roofL.done{background:linear-gradient(135deg,rgba(184,115,51,.28),rgba(184,115,51,.06));border-color:rgba(240,168,108,.95)}
.layer.roofL .lm{color:#F0C79B}
.layer.now{box-shadow:0 0 0 1px rgba(240,168,108,.55),0 6px 18px rgba(0,0,0,.35)}
.grade{margin-top:8px;height:1px;background:repeating-linear-gradient(90deg,rgba(127,166,196,.5) 0 7px,transparent 7px 13px)}
.gradel{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:#5E7C97;margin-top:5px}
.bpprog{margin-top:14px;height:3px;background:rgba(127,166,196,.18);border-radius:2px;overflow:hidden}
.bpprog i{display:block;height:100%;background:var(--copper);border-radius:2px;transition:width .5s ease}
.bpnote{font-family:var(--mono);font-size:9.5px;color:#6E8CA8;margin-top:10px;line-height:1.5}
/* the real 3D building, re-homed into the companion stage */
.bpstage{position:relative;height:430px;border-radius:3px;overflow:hidden;margin-bottom:14px;background:radial-gradient(125% 95% at 58% 4%,#294763 0%,#18293F 32%,#0B1626 63%,#04090F 100%),radial-gradient(70% 34% at 50% 99%,rgba(184,115,51,.11),transparent 72%);cursor:grab;user-select:none;touch-action:none}
.bpstage.drag{cursor:grabbing}
.bpstage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 105% at 50% 42%,transparent 54%,rgba(2,6,12,.5) 100%)}
#world{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1380px;transition:perspective 1.4s cubic-bezier(.32,.72,.16,1)}
#lift{transition:transform 1.5s cubic-bezier(.32,.72,.16,1)}
#model{position:relative;width:380px;height:250px;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.32,.72,.16,1)}
#model *{transform-style:preserve-3d}
.m{position:absolute;transition:opacity .9s ease,transform 1.1s cubic-bezier(.32,.72,.16,1),background .5s ease}
#sun{position:absolute;left:58%;top:8%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;pointer-events:none;transition:opacity 1.4s ease,top 1.6s cubic-bezier(.32,.72,.16,1);background:radial-gradient(circle,rgba(255,214,170,.20) 0%,rgba(217,145,90,.10) 32%,rgba(217,145,90,0) 68%)}
#horizon{position:absolute;left:0;right:0;top:30%;height:40%;opacity:0;transition:opacity 1.6s ease;pointer-events:none;background:linear-gradient(90deg,rgba(97,150,214,.12) 0%,rgba(97,150,214,.03) 38%,transparent 60%,rgba(217,145,90,.10) 100%),linear-gradient(to top,rgba(217,145,90,.10),rgba(217,145,90,.02) 46%,transparent)}
#horizon::after{content:'';position:absolute;left:8%;right:8%;top:52%;height:1px;background:linear-gradient(90deg,transparent,rgba(163,197,240,.35) 20%,rgba(240,168,108,.4) 80%,transparent)}
.halo{border:1.5px solid rgba(240,168,108,.34);background:radial-gradient(closest-side,transparent 60%,rgba(240,168,108,.05) 84%,transparent 100%);animation:halopulse 6.5s ease-in-out infinite}
@keyframes halopulse{0%,100%{box-shadow:0 0 40px 3px rgba(240,168,108,.14),inset 0 0 32px rgba(240,168,108,.05)}50%{box-shadow:0 0 64px 8px rgba(240,168,108,.28),inset 0 0 38px rgba(240,168,108,.10)}}
#memchip{position:fixed;z-index:60;pointer-events:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.2px;color:#EAF1F8;background:rgba(8,16,27,.95);border:1px solid rgba(116,179,198,.4);border-radius:3px;padding:6px 9px;max-width:230px;opacity:0;transition:opacity .15s;transform:translateY(-2px)}
#memchip.on{opacity:1}
.mem.hot{outline:1px solid rgba(240,168,108,.9);outline-offset:1px}
.bphint{font-family:var(--mono);font-size:9px;letter-spacing:.4px;color:#5E7C97;text-align:center;margin-top:-4px;margin-bottom:8px}

/* generic section */
.sec{padding:70px 0 0}
.sechead{max-width:66ch}
.sectitle{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.1;letter-spacing:-.01em;margin:12px 0 0}
.secdeck{font-size:17px;color:var(--ink2);margin:14px 0 0;max-width:60ch;line-height:1.6}

/* portfolio cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:30px;background:var(--line);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.pcard{background:var(--card);padding:26px 28px}
.pctag{font-family:var(--mono);font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--copper2)}
.pct{font-family:var(--serif);font-size:21px;color:var(--ink);margin:8px 0 0;line-height:1.2}
.pcidea{font-size:15px;color:var(--ink2);margin:10px 0 0;line-height:1.55}
.pcstats{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:16px}
.pcstat b{font-family:var(--serif);font-size:22px;color:var(--copper2);font-variant-numeric:tabular-nums;display:block;line-height:1}
.pcstat span{font-family:var(--mono);font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);display:block;margin-top:4px}
.pcimp{font-size:14px;color:var(--ink);margin-top:16px;border-top:1px solid var(--line);padding-top:14px;line-height:1.5}
.pcimp b{font-weight:500}
.pcwho{font-family:var(--mono);font-size:11px;color:var(--copper2);margin-top:14px;line-height:1.55;letter-spacing:.2px}

/* network */
.netgrid{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:30px}
.nrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.nrn{font-family:var(--serif);font-size:15px;color:var(--ink);width:150px;flex:0 0 150px}
.ntrack{flex:1;height:9px;background:var(--paper2);border-radius:5px;overflow:hidden}
.nfill{display:block;height:100%;background:var(--steel);border-radius:5px}
.nv{font-family:var(--mono);font-size:12px;color:var(--ink2);width:34px;text-align:right;flex:0 0 34px}
.nkpi{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:2px;background:var(--card);align-self:start}
.nkpi .k{padding:16px 18px;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.nkpi .k:nth-child(-n+2){border-top:none}
.nkpi .k:nth-child(odd){border-left:none}
.nkpi .kv{font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1}
.nkpi .kl{font-family:var(--mono);font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);margin-top:5px;line-height:1.4}
.nkpi.wide{grid-template-columns:repeat(4,1fr)}
.nkpi.wide .k:nth-child(-n+2){border-top:none}
.nkpi.wide .k:nth-child(2),.nkpi.wide .k:nth-child(3),.nkpi.wide .k:nth-child(4){border-left:1px solid var(--line)}
.nkpi.wide .k{border-top:none}
.subh{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.clngrid{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:32px}
.clnbar{display:flex;align-items:center;gap:12px;padding:7px 0}
.clnbn{font-family:var(--serif);font-size:15px;color:var(--ink);width:158px;flex:0 0 158px}
.clnbt{flex:1;height:9px;background:var(--paper2);border-radius:5px;overflow:hidden}
.clnbf{display:block;height:100%;border-radius:5px}
.clnbv{font-family:var(--mono);font-size:12px;color:var(--ink2);width:22px;text-align:right}
.clntiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.clntile{border:1px solid var(--line);border-radius:2px;padding:11px 13px;background:var(--card)}
.clntile.meet{border-color:rgba(63,122,87,.42)}
.clntile.tbd{opacity:.62}
.clndots{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.clndots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.clnplus{font-family:var(--mono);font-size:9px;color:var(--up)}
.clntn{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.1}
.clntk{font-family:var(--mono);font-size:8.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);margin-top:4px}
/* readiness heatmap */
.heatwrap{margin-top:26px;overflow-x:auto}
.heat{border-collapse:collapse;font-family:var(--mono);font-size:11px;width:100%}
.heat th,.heat td{padding:7px 6px;text-align:center;border:2px solid var(--paper)}
.heat .hcorner{background:transparent;border:none}
.heat .hf{color:var(--mut);font-weight:500;font-size:9px;letter-spacing:.2px;text-transform:uppercase;background:transparent;border:none;vertical-align:bottom}
.heat .hr{color:var(--ink);text-align:left;font-family:var(--serif);font-size:14px;white-space:nowrap;background:transparent;border:none;padding-right:14px}
.heat td{font-variant-numeric:tabular-nums;color:#3C4859;min-width:40px}
.heat .hz{background:var(--paper2)}
.heat .htot{background:transparent;color:var(--ink);font-weight:600;border:none;font-family:var(--serif);font-size:14px}
.heatleg{display:flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--mut);justify-content:flex-end}
.hramp{width:130px;height:10px;border-radius:2px;background:linear-gradient(90deg,#EAF0F6,#6E9BCB,#22507B)}

/* forward value */
.fvtier{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--copper2);margin:26px 0 4px}
.fvrow{display:grid;grid-template-columns:1fr auto;gap:24px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.fvt{font-family:var(--serif);font-size:18px;color:var(--ink)}
.fvi{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5;max-width:70ch}
.fvimp{font-size:13px;color:var(--copper2);white-space:nowrap;font-family:var(--mono);letter-spacing:.2px}

/* tools */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:30px}
.tool{border:1px solid var(--line);border-radius:2px;background:var(--card);padding:30px 32px;display:flex;flex-direction:column;color:inherit;min-height:184px}
.tool:hover{border-color:var(--copper)}
.toolt{font-family:var(--serif);font-size:24px;color:var(--ink);display:flex;align-items:center;gap:10px}
.livep{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:#fff;background:var(--up);padding:2px 6px;border-radius:2px}
.toolm{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:6px;letter-spacing:.2px}
.tooln{font-size:14px;color:var(--ink2);margin-top:10px;line-height:1.55}
.toolcta{font-family:var(--mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--copper2);margin-top:auto;padding-top:16px}

/* the ask */
.ask{margin-top:70px;border:1px solid var(--copper);border-radius:3px;background:linear-gradient(120% 100% at 100% 0,rgba(184,115,51,.06),var(--card) 60%);padding:44px 46px}
.askt{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,34px);line-height:1.12;margin:12px 0 0;max-width:26ch}
.askl{margin-top:22px}
.aski{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);align-items:baseline}
.askn{font-family:var(--mono);font-size:13px;color:var(--copper2)}
.askk{font-family:var(--serif);font-size:19px;color:var(--ink)}
.askv{font-size:14.5px;color:var(--ink2);margin-top:3px;line-height:1.5}

footer{margin-top:80px;border-top:1px solid var(--line);padding-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:var(--mut);line-height:1.7}
.fbrand{font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:0;margin-bottom:8px}

@media(max-width:920px){
 .build{grid-template-columns:1fr;gap:0}
 .buildco{position:static;order:-1;margin:0 -34px 16px}
 .bpcard{max-width:none;border-radius:0;border-left:none;border-right:none;padding:16px 18px 13px}
 .bpstage{height:250px}
 .bphint{display:none}
 .h1{font-size:clamp(34px,9vw,52px)}
 .stage{padding:44px 0}
 .heat{font-size:10px}.heat th,.heat td{padding:6px 4px;min-width:32px}
 .hkpi{grid-template-columns:repeat(2,1fr)}.hkpi .k:nth-child(3),.hkpi .k:nth-child(4){border-top:1px solid var(--line)}.hkpi .k:nth-child(odd){border-left:none}
 .cards,.tools,.netgrid,.clngrid{grid-template-columns:1fr}
 .clntiles{grid-template-columns:repeat(2,1fr)}

 window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&dx*dx+dy*dy>16)moved=true;rz=Math.max(-48,Math.min(-12,drag.rz+dx*0.12));rx=Math.max(48,Math.min(88,drag.rx-dy*0.1));M.style.transform=`rotateX(${rx}deg) rotateZ(${rz}deg)`;});
 window.addEventListener('pointerup',()=>{if(!drag)return;drag=null;st.classList.remove('drag');M.style.transition='';});
}

function heatBlue(t){t=Math.max(0,Math.min(1,t));const a=[234,240,246],b=[34,80,123];const c=a.map((v,i)=>Math.round(v+(b[i]-v)*Math.pow(t,0.8)));return `rgb(${c[0]},${c[1]},${c[2]})`;}
function readinessH(){
 let mx=0; HEAT.rows.forEach(r=>r[1].forEach(v=>{if(v>mx)mx=v;}));
 const head=`<tr><th class="hcorner"></th>${HEAT.funcs.map(f=>`<th class="hf">${f}</th>`).join('')}<th class="hf">Total</th></tr>`;
 const body=HEAT.rows.map(r=>{
  const tot=r[1].reduce((a,b)=>a+b,0);
  const cells=r[1].map(v=>{ if(!v)return `<td class="hz"></td>`; const t=v/mx; return `<td style="background:${heatBlue(t)};color:${t>0.52?'#EAF1F8':'#3C4859'}">${v}</td>`; }).join('');
  return `<tr><th class="hr">${r[0]}</th>${cells}<td class="htot">${tot.toLocaleString()}</td></tr>`;
 }).join('');
 return `<section class="sec" id="s-readiness">${secHead('The readiness read','Where the pain actually is','4,468 pain points, coded from 372 interviews and 2,869 surveys across twelve businesses. Darker is more. The heat sits in Service, Payroll and Invoicing, not out in the field.')}

 </section>`;
}
function networkH(){
 const goal=CLN.goal, fmax=Math.max(...CLN.func.map(f=>f[1]));
 const seated=CLN.bu.filter(b=>b[1]>0).length, atGoal=CLN.bu.filter(b=>b[1]>=goal).length;
 const stats=[[CLN.nominated,'change leaders nominated'],[seated+' of '+CLN.businesses,'businesses with a seat'],[atGoal,'businesses at the 2+ goal'],['6','functional areas covered']];
 const fbars=CLN.func.map((f,i)=>`<div class="clnbar"><span class="clnbn">${f[0]}</span><span class="clnbt"><span class="clnbf" style="width:${(f[1]/fmax*100).toFixed(0)}%;background:${i===0?'var(--amber)':'var(--copper)'}"></span></span><span class="clnbv">${f[1]}</span></div>`).join('');
 const tiles=CLN.bu.slice().sort((a,b)=>b[1]-a[1]).map(b=>{
  const n=b[1], state=n>=goal?'meet':(n===1?'short':'tbd'), kick=n>=goal?'meets the goal':(n===1?'one to go':'no seat yet');
  const dots=[0,1].map(d=>{const on=d<n;const c=on?(n>=goal?'var(--up)':'var(--amber)'):'rgba(140,133,120,.28)';return `<i style="background:${c}"></i>`;}).join('')+(n>2?`<span class="clnplus">+${n-2}</span>`:'');
  return `<div class="clntile ${state}"><div class="clndots">${dots}</div><div class="clntn">${b[0]}</div><div class="clntk">${kick}</div></div>`;
 }).join('');
 return `<section class="sec" id="s-network">${secHead('The Change Leader Network','A named person inside every company','The day-one support floor: when a crew lead cannot clock in Monday, the answer is two desks over, not a ticket. The target is two per business.')}

   <div><div class="subh">Coverage by function</div>${fbars}</div>
   <div><div class="subh">Seats by business &middot; two dots is the goal</div><div class="clntiles">${tiles}</div></div>
  </div>
 </section>`;
}

/* scroll-drive the building companion + nav scroll-spy */
function wireScroll(){
 const secs=$$('.stage');
 const io=new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ const i=+e.target.dataset.stage; setBuilding(i); } });
 },{rootMargin:'-45% 0px -45% 0px',threshold:0});
 secs.forEach(s=>io.observe(s));
}
function wireNav(){
 const nav=$('#topnav'); const links=$$('.nlinks a');
 let ticking=false;
 function onScroll(){
  const y=window.scrollY||document.documentElement.scrollTop||0;
  nav.classList.toggle('show', y>150);
  let active=null;
  links.forEach(a=>{const t=$(a.getAttribute('href')); if(t&&t.getBoundingClientRect().top<160)active=a;});
  links.forEach(a=>a.classList.toggle('on',a===active));
  ticking=false;
 }
 addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
 onScroll();
}
render();
